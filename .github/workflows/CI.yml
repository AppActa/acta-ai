name: CI ACTA AI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    env:
      # O projeto expõe módulos no diretório raiz (por exemplo, main e agents).
      # O uv não instala este repositório como pacote porque package = false.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          python-version: "3.14"

      - run: make validate
