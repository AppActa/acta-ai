name: CI ACTA AI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
