[project]
name = "acta-ai"
version = "0.1.0"
description = "API multiagente do chatbot gerencial ACTA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136,<1",
    "groq>=0.37.1",
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<2",
    "langchain-groq>=1.1,<2",
    "langchain-nvidia-ai-endpoints>=1.4,<2",
    "langgraph>=1.2,<2",
    "mcp==1.28.1",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
    "opentelemetry-sdk>=1.38,<2",
    "pydantic>=2.13,<3",
    "pymongo>=4.17,<5",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.16,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
