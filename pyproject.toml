[project]
name = "acta-ai"
version = "0.1.0"
description = "API multiagente do chatbot gerencial ACTA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136,<1",
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<2",
    "langchain-google-genai>=4,<5",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "mcp==1.28.1",
    "openai>=2,<3",
    "pydantic>=2.13,<3",
    "pymongo>=4.17,<5",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.17,<2",
    "typesafe-sdk>=0.7.2",
    "uvicorn>=0.49,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.16,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
