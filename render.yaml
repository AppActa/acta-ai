services:
  - type: web
    name: acta-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ACTA_OPENAI_MODEL
        value: gpt-6-luna
      - key: ACTA_OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe
      - key: ACTA_OPENAI_REASONING_EFFORT
        value: none
      - key: ACTA_OPENAI_MAX_TOKENS
        value: "2048"
      - key: ACTA_SPECIALIST_FEW_SHOTS
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: acta_ai
      - key: ACTA_SYSTEM_FEATURES_DB_NAME
        value: acta
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_MEMORY_MESSAGES_COLLECTION_NAME
        value: memoria_mensagens
      - key: QDRANT_MEMORY_COLLECTION_NAME
        value: memoria_usuario
      - key: MONGODB_SESSIONS_COLLECTION
        value: chat_sessoes
      - key: ACTA_STORE_RAW_PII
        value: "false"
      - key: ACTA_MAX_MESSAGE_CHARS
        value: "8000"
      - key: ACTA_MCP_URL
        sync: false
      - key: ACTA_MCP_API_KEY
        sync: false
      - key: ACTA_MCP_TIMEOUT_SECONDS
        value: "30"
      - key: ACTA_MCP_MAX_ATTEMPTS
        value: "2"
