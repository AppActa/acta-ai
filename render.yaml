services:
  - type: web
    name: acta-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false
      - key: ACTA_INTENTION_MAX_RETRIES
        value: "2"
      - key: ACTA_RESPONSE_MAX_RETRIES
        value: "2"
      - key: ACTA_OPENAI_MODEL
        value: gpt-6-luna
      - key: ACTA_OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe
      - key: ACTA_OPENAI_REASONING_EFFORT
        value: none
      - key: ACTA_OPENAI_MAX_TOKENS
        value: "2048"
      - key: ACTA_AUTH_API_URL
        value: https://acta-auth-api.34-232-250-240.sslip.io/api/v1
      - key: ACTA_AUTH_API_TIMEOUT_SECONDS
        value: "10"
      - key: ACTA_CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ACTA_SYSTEM_FEATURES_DB_NAME
        value: acta
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_TIMEOUT_SECONDS
        value: "10"
      - key: QDRANT_MEMORY_MESSAGES_COLLECTION_NAME
        value: memoria_mensagens
      - key: QDRANT_MEMORY_VECTOR_SIZE
        value: "768"
      - key: ACTA_MEMORY_RECENT_MESSAGES
        value: "30"
      - key: ACTA_MEMORY_SUMMARY_EVERY_MESSAGES
        value: "12"
      - key: ACTA_MCP_URL
        sync: false
      - key: ACTA_MCP_API_KEY
        sync: false
      - key: ACTA_MCP_TIMEOUT_SECONDS
        value: "20"
      - key: ACTA_MCP_MAX_ATTEMPTS
        value: "2"
      - key: ACTA_MCP_USUARIO_ID
        value: "0"
      - key: ACTA_MCP_EMPRESA_ID
        value: "0"
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: acta-ai
